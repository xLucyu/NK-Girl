services:
  bot:
    container_name: nk-girl
    restart: unless-stopped
    init: true
    network_mode: host

    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim AS build

        WORKDIR /app

        COPY package.json package-lock.json ./
        RUN npm ci

        COPY tsconfig.json ./
        COPY src ./src

        RUN npm run build


        FROM node:22-bookworm-slim

        WORKDIR /app

        ENV NODE_ENV=production

        COPY package.json package-lock.json ./
        RUN npm ci --omit=dev && npm cache clean --force

        COPY --from=build /app/dist ./dist

        # Runtime assets used by loadImage()
        COPY --from=build /app/src/btd6/assets ./dist/btd6/assets

        # Runtime font used by render()
        COPY --from=build /app/src/ui/fonts ./src/ui/fonts

        CMD ["npm", "start"]

    env_file:
      - .env

    volumes:
      - ./serviceAccount.json:/app/serviceAccount.json:ro
